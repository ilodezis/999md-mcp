name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: the live tests catch 999.md changing its API even when this code does not
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0  # this action publishes no floating major tags
      - run: uv sync --frozen
      - run: uv run python -m pytest -q
